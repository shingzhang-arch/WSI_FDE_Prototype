<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>See More Flow - Preview</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@salesforce-ux/design-system@2.25.0/assets/styles/salesforce-lightning-design-system.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Salesforce Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f3f3f3;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* ===== TAB BAR ===== */
        .tab-bar {
            display: flex;
            align-items: center;
            gap: 1rem;
            background-color: #ffffff;
            border-bottom: 1px solid #e5e5e5;
            padding: 0.75rem 1.5rem;
            flex-shrink: 0;
            height: 60px;
        }

        .tab {
            font-size: 0.875rem;
            font-weight: 600;
            color: #706e6b;
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-bottom: 2px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
        }

        .tab:hover {
            color: #181818;
        }

        .tab.active {
            color: #181818;
            border-bottom-color: #0176d3;
        }

        /* ===== MAIN CONTENT WRAPPER ===== */
        .main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* ===== LEFT PANEL (Settings Panel from V1) ===== */
        .left-rail {
            width: 280px;
            min-width: 280px;
            background: #ffffff;
            border-right: 1px solid #e5e5e5;
            padding: 1.25rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .panel-title {
            font-size: 0.875rem;
            font-weight: 700;
            color: #181818;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding-bottom: 0.75rem;
            border-bottom: 2px solid #181818;
        }

        .panel-section {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .panel-section-title {
            font-size: 0.75rem;
            font-weight: 700;
            color: #706e6b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .panel-option {
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
            padding: 0.5rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.15s;
            border: 1px solid transparent;
        }

        .panel-option:hover {
            background-color: #f3f3f3;
        }

        .panel-option.selected {
            background-color: #eef4ff;
            border-color: #0176d3;
        }

        .panel-option input[type="radio"] {
            margin-top: 2px;
            accent-color: #0176d3;
            flex-shrink: 0;
        }

        .panel-option-content {
            display: flex;
            flex-direction: column;
            gap: 0.125rem;
        }

        .panel-option-label {
            font-size: 0.8125rem;
            font-weight: 600;
            color: #181818;
        }

        .panel-option-desc {
            font-size: 0.6875rem;
            color: #706e6b;
            line-height: 1.4;
        }

        .panel-option-badge {
            font-size: 0.5625rem;
            font-weight: 700;
            padding: 0.125rem 0.375rem;
            border-radius: 3px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .panel-option-badge.recommended {
            background: #e8f5e9;
            color: #2e7d32;
        }

        /* ===== CENTER AREA (Phone Frame) ===== */
        .center-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            overflow: hidden;
            background: #f3f3f3;
        }

        /* V1 Phone bezel styling */
        .phone-bezel {
            width: 393px;
            background: #1d1d1f;
            border-radius: 50px;
            padding: 10px;
            position: relative;
            box-shadow: 0 0 0 1px #3a3a3c, 0 25px 70px rgba(0,0,0,0.35);
        }

        .phone-dynamic-island {
            position: absolute;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            width: 126px;
            height: 37px;
            background: #000;
            border-radius: 20px;
            z-index: 10;
        }

        .phone-screen {
            background: #f8f9fa;
            border-radius: 40px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 780px;
            padding-top: 52px;
            position: relative;
        }

        .phone-screen-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.625rem 0.75rem;
            background: #1a1a1a;
            flex-shrink: 0;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            width: 100%;
            z-index: 100;
        }

        .chat-header-sparkle {
            font-size: 1rem;
            color: #fff;
            flex-shrink: 0;
        }

        .chat-header-brand-name {
            flex: 1;
            font-size: 0.9375rem;
            font-weight: 700;
            color: #ffffff;
            white-space: nowrap;
        }

        .phone-screen-body {
            flex: 1;
            overflow-y: auto;
            min-height: 0;
            background: #f8f9fa;
        }

        .phone-screen-body::-webkit-scrollbar {
            display: none;
        }

        .phone-screen-body {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .mobile-input-bar {
            flex-shrink: 0;
            padding: 0.5rem 0.75rem;
            background: #fff;
            border-top: 1px solid #e5e5e5;
            border-radius: 0 0 40px 40px;
        }

        .mobile-input-field {
            width: 100%;
            padding: 0.5rem 0.875rem;
            border: 1px solid #d0d0d0;
            border-radius: 20px;
            font-size: 0.8125rem;
            color: #706e6b;
            background: #fff;
            outline: none;
            font-family: inherit;
        }

        .mobile-input-field:focus {
            border-color: #0176d3;
        }

        .phone-home-indicator-wrap {
            display: flex;
            justify-content: center;
            padding: 6px 0 4px;
            background: #1d1d1f;
        }

        .phone-home-indicator {
            width: 134px;
            height: 5px;
            background: #555;
            border-radius: 3px;
        }

        /* V1 Chat Container Styling */
        .chat-container {
            max-width: 375px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            padding: 1rem;
            background-color: #f8f9fa;
        }

        .chat-message {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            animation: messageSlideIn 0.3s ease-out;
            opacity: 0;
            transform: translateY(10px);
        }

        .chat-message.visible {
            opacity: 1;
            transform: translateY(0);
        }

        @keyframes messageSlideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .chat-message.user {
            align-items: flex-end;
        }

        .chat-message.agent {
            align-items: flex-start;
            display: flex;
            flex-direction: row;
            gap: 0.5rem;
        }

        .message-bubble {
            max-width: 85%;
            padding: 0.75rem 1rem;
            border-radius: 12px;
            word-wrap: break-word;
        }

        .chat-message.user .message-bubble {
            background-color: #0176d3;
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }

        .message-text {
            font-size: 0.875rem;
            line-height: 1.4;
            margin: 0;
        }

        .message-time {
            font-size: 0.6875rem;
            color: #706e6b;
            padding: 0 0.5rem;
        }

        .chat-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            overflow: hidden;
            background-color: transparent;
        }

        .chat-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .message-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* V1 Preview Container */
        .preview-container {
            max-width: 375px;
            width: 100%;
            background: white;
            padding: 1rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            position: relative;
        }

        /* V1 Header */
        .header {
            margin-bottom: 0.75rem;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 0.25rem;
        }

        .header h2 {
            font-size: 1.125rem;
            font-weight: 700;
            color: #181818;
            margin: 0;
        }

        .header p {
            font-size: 0.875rem;
            color: #706e6b;
        }

        /* See More Link (V1) */
        .see-more-link {
            font-size: 0.8125rem;
            font-weight: 600;
            color: #0176d3;
            text-decoration: none;
            white-space: nowrap;
            cursor: pointer;
            pointer-events: auto;
        }

        .see-more-link:hover {
            text-decoration: underline;
        }

        .see-more-link.is-hidden {
            visibility: hidden;
            pointer-events: none;
        }

        /* See More Button (V1) */
        .see-more-button-full {
            display: block;
            width: 100%;
            padding: 0.625rem;
            margin-top: 0.75rem;
            background: transparent;
            border: 1px solid #181818;
            color: #181818;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: all 0.15s;
        }

        .see-more-button-full:hover {
            background-color: #181818;
            color: #ffffff;
        }

        /* V1 Carousel Section */
        .carousel-section {
            margin-bottom: 1rem;
        }

        .carousel-wrapper {
            position: relative;
            margin-bottom: 1rem;
        }

        .carousel-track {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.5rem;
            overflow: hidden;
        }

        /* Product Card (V1) */
        .product-card {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .product-card-inner {
            position: relative;
            display: flex;
            flex-direction: column;
            height: 100%;
            border: 1px solid #e5e5e5;
            border-radius: 0;
            background-color: #ffffff;
            transition: box-shadow 0.2s ease;
        }

        .product-card-inner:hover {
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .product-badge {
            position: absolute;
            top: 0.375rem;
            left: 0.375rem;
            display: flex;
            align-items: center;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            z-index: 1;
        }

        .badge-olive-pick {
            background-color: #e8f5e9;
            color: #2e7d32;
        }

        .badge-best-seller {
            background-color: #e3f2fd;
            color: #1565c0;
        }

        .badge-top-rated {
            background-color: #fff3e0;
            color: #e65100;
        }

        .badge-text {
            font-size: 0.5625rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .product-image-container {
            width: 100%;
            height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #fafaf9;
            overflow: hidden;
        }

        .product-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-details {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 0.5rem;
        }

        .product-name {
            font-weight: 600;
            color: #181818;
            line-height: 1.3;
            margin-bottom: 0.25rem;
            font-size: 0.75rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .price-text {
            font-weight: 400;
            color: #181818;
            font-size: 0.75rem;
            margin-bottom: 0.5rem;
        }

        .action-buttons {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 0.375rem;
        }

        .btn {
            padding: 0.5rem;
            border-radius: 4px;
            border: none;
            font-size: 0.6875rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
        }

        .btn-quick-view {
            background-color: transparent;
            color: #0176d3;
            border: 1px solid #0176d3;
            text-transform: uppercase;
            text-align: center;
            display: block;
            letter-spacing: 0.5px;
            font-weight: 600;
            border-radius: 0;
        }

        .btn-quick-view:hover {
            background-color: #0176d3;
            color: white;
        }

        .btn-shop-now {
            background-color: #181818;
            color: white;
            text-transform: uppercase;
            text-decoration: none;
            text-align: center;
            display: block;
            letter-spacing: 0.5px;
            font-weight: 600;
            border-radius: 0;
            border: none;
            cursor: pointer;
        }

        .btn-shop-now:hover {
            background-color: #333333;
        }

        /* V1 Carousel Navigation */
        .carousel-navigation {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.75rem;
            margin-top: 0.75rem;
        }

        .carousel-nav {
            flex-shrink: 0;
            background: none;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 0.2s;
            font-size: 1.5rem;
            color: #181818;
            padding: 0.5rem;
            line-height: 1;
        }

        .carousel-nav:hover:not(:disabled) {
            opacity: 0.7;
        }

        .carousel-nav:disabled {
            color: #c9c9c9;
            cursor: not-allowed;
        }

        .pagination-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
        }

        .pagination-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            border: none;
            background-color: #c9c9c9;
            cursor: pointer;
            transition: background-color 0.2s;
            padding: 0;
            flex-shrink: 0;
        }

        .pagination-dot:hover:not(.active) {
            background-color: #a0a0a0;
        }

        .pagination-dot.active {
            background-color: #181818;
        }

        /* ===== NUDGE CHIPS ===== */
        .nudge-chips-container {
            display: none;
            flex-direction: column;
            gap: 0.5rem;
            margin-top: 0.75rem;
            padding-top: 0.75rem;
            border-top: 1px solid #e5e5e5;
        }

        .nudge-chips-container.visible {
            display: flex;
        }

        .nudge-chips-label {
            font-size: 0.6875rem;
            font-weight: 600;
            color: #706e6b;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .nudge-chips-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.375rem;
        }

        .nudge-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            padding: 0.375rem 0.625rem;
            border-radius: 100px;
            border: 1px solid #c9c7c5;
            background: #ffffff;
            color: #181818;
            font-size: 0.6875rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
            text-decoration: none;
        }

        .nudge-chip:hover {
            background-color: #f3f3f3;
            border-color: #706e6b;
        }

        .nudge-chip.active {
            background-color: #0176d3;
            border-color: #0176d3;
            color: #ffffff;
        }

        .nudge-chip-icon {
            font-size: 0.75rem;
            line-height: 1;
        }

        .nudge-chip.selected {
            background-color: #181818;
            border-color: #181818;
            color: #ffffff;
            pointer-events: none;
        }

        /* ===== RIGHT RAIL (Comments) ===== */
        .right-rail {
            width: 320px;
            min-width: 320px;
            background: #ffffff;
            border-left: 1px solid #e5e5e5;
            padding: 1.25rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .comments-rail {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .comments-form {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .comments-form > div {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .comments-form label {
            font-size: 0.75rem;
            font-weight: 700;
            color: #706e6b;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .comments-form input[type="text"],
        .comments-form textarea {
            border: 1px solid #d3d3d3;
            border-radius: 4px;
            padding: 0.5rem;
            font-size: 0.8125rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }

        .comments-form input[type="text"]:focus,
        .comments-form textarea:focus {
            border-color: #0176d3;
        }

        .comments-form textarea {
            resize: vertical;
            min-height: 80px;
            max-height: 120px;
        }

        .comments-form-comment-type {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.8125rem;
            cursor: pointer;
        }

        .radio-option input {
            cursor: pointer;
        }

        .comments-submit-btn {
            padding: 0.75rem;
            background: #0176d3;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-size: 0.8125rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }

        .comments-submit-btn:hover {
            background: #005ba1;
        }

        .comment-item {
            padding: 0.75rem;
            background: #f3f3f3;
            border-radius: 4px;
            border-left: 3px solid #0176d3;
        }

        .comment-author {
            font-size: 0.75rem;
            font-weight: 700;
            color: #181818;
        }

        .comment-type {
            font-size: 0.65rem;
            color: #999;
            text-transform: uppercase;
            margin-left: 0.5rem;
        }

        .comment-text {
            font-size: 0.8125rem;
            color: #565454;
            margin-top: 0.25rem;
            line-height: 1.3;
        }

        .comment-date {
            font-size: 0.65rem;
            color: #999;
            margin-top: 0.25rem;
        }
    </style>
</head>
<body>
    <!-- ===== TAB BAR ===== -->
    <div class="tab-bar">
        <a href="/" class="tab">V1 Prototype (carousel, see more)</a>
        <a href="/nudges" class="tab">Nudge Scenarios</a>
        <a href="/see-more" class="tab active">See More Flow</a>
    </div>

    <!-- ===== MAIN CONTENT ===== -->
    <div class="main-content">
        <!-- ===== LEFT RAIL (V1 Settings Panel) ===== -->
        <div class="left-rail">
            <div class="panel-title">Variation Controls</div>
            <div class="panel-section">
                <div class="panel-section-title">1. See More Flow</div>
                <label class="panel-option selected">
                    <input type="radio" name="seeMoreFlowVariation" value="chips" checked onchange="selectVariation('chips')">
                    <div class="panel-option-content">
                        <div class="panel-option-label">1.1 Nudge Chips <span class="panel-option-badge recommended">Recommended</span></div>
                        <div class="panel-option-desc">Conversational nudge buttons guide the next step</div>
                    </div>
                </label>
                <label class="panel-option">
                    <input type="radio" name="seeMoreFlowVariation" value="link" onchange="selectVariation('link')">
                    <div class="panel-option-content">
                        <div class="panel-option-label">1.2 See More Link</div>
                        <div class="panel-option-desc">Header link reveals more carousels on each click</div>
                    </div>
                </label>
            </div>
        </div>

        <!-- ===== CENTER AREA (Phone Frame) ===== -->
        <div class="center-area">
            <div class="phone-bezel">
                <div class="phone-dynamic-island"></div>
                <div class="phone-screen">
                    <div class="phone-screen-header">
                        <span class="chat-header-sparkle">✦</span>
                        <span class="chat-header-brand-name">AI Sous Chef</span>
                    </div>
                    <div class="phone-screen-body" id="phoneScreenBody"></div>
                    <div class="mobile-input-bar">
                        <input type="text" class="mobile-input-field" placeholder="Ask me anything." disabled>
                    </div>
                </div>
                <div class="phone-home-indicator-wrap">
                    <div class="phone-home-indicator"></div>
                </div>
            </div>
        </div>

        <!-- ===== RIGHT RAIL (Comments) ===== -->
        <div class="right-rail">
            <div class="comments-rail">
                <div class="comments-form">
                    <div>
                        <label for="commentAuthor">Your name</label>
                        <input type="text" id="commentAuthor" placeholder="Enter your name" maxlength="80">
                    </div>
                    <div>
                        <label style="display:block;margin-bottom:0.25rem;">Comment type</label>
                        <div class="comments-form-comment-type" id="commentTypeGroup">
                            <label class="radio-option">
                                <input type="radio" name="commentType" value="general" checked>
                                General feedback
                            </label>
                            <label class="radio-option">
                                <input type="radio" name="commentType" value="tech">
                                Technical note
                            </label>
                            <label class="radio-option">
                                <input type="radio" name="commentType" value="feature">
                                Feature idea
                            </label>
                        </div>
                    </div>
                    <div>
                        <label for="commentText">Comment</label>
                        <textarea id="commentText" placeholder="Share feedback, questions, or notes... (Ctrl+Enter to submit)"></textarea>
                    </div>
                    <button type="button" class="comments-submit-btn" onclick="submitComment()">Post comment</button>
                </div>

    <script>

            },
            {
                id: '10',

                imageUrl: 'https://assets.wsimgs.com/wsimgs/ab/images/dp/wcm/202451/0005/img97o.jpg',
                price: 49.95,
                badge: null,
                productUrl: 'https://www.williams-sonoma.com/products/hamilton-beach-coffee-maker/'
            },
            {
                id: '11',
                name: 'Capresso Infinity Espresso Machine',
                imageUrl: 'https://assets.wsimgs.com/wsimgs/ab/images/dp/wcm/202440/0021/img.jpg',
                price: 279.95,
                badge: 'bestSeller',
                productUrl: 'https://www.williams-sonoma.com/products/capresso-infinity-espresso-machine/'
            },
            {
                id: '12',
                name: 'Melitta AromaFresh Coffee Maker',
                imageUrl: 'https://assets.wsimgs.com/wsimgs/ab/images/dp/wcm/202440/0021/img.jpg',
                price: 89.95,
                badge: 'topRated',
                productUrl: 'https://www.williams-sonoma.com/products/melitta-aromafresh-coffee-maker/'
            }
        ];

        // State variables
        let carouselPage = 0;
        let comments = [];
        let currentVariation = 'chips'; // 'link' or 'chips'
        const carouselStates = {}; // Track individual carousel pagination states
        let carouselSequence = 0; // Counter for carousel IDs
        let currentCategory = 'coffee'; // Track current category (coffee, espresso, grinders)
        let browseLevelByCategory = {}; // Track browse level per category

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', () => {
            renderInitialChat();
            loadComments();
            document.getElementById('commentText').addEventListener('keydown', (e) => {
                if (e.ctrlKey && e.key === 'Enter') {
                    submitComment();
                }
            });
        });

        function renderInitialChat() {
            const body = document.getElementById('phoneScreenBody');
            carouselSequence = 0;
            currentCategory = 'coffee';
            browseLevelByCategory = { coffee: 1, espresso: 0, grinders: 0 };
            
            const carouselId = `carousel-${carouselSequence}`;
            carouselStates[carouselId] = { currentSlide: 0 };
            const agentMsg = renderCarouselBlock(carouselId, carouselSequence, 0, 'Coffee Makers', 'Coffee makers curated just for you • 5 items', 'coffee', 1);

            body.innerHTML = `
                <div class="chat-container" id="chatContainer">
                    <div class="chat-message user visible">
                        <div class="message-bubble">
                            <div class="message-text">What is the best coffee maker?</div>
                        </div>
                        <div class="message-time">Just now</div>
                    </div>
                    ${agentMsg}
                </div>
            `;
        }

        function renderCarouselBlock(carouselId, sequence, productStartIdx, title, subtitle, category = 'coffee', browseLevel = 1) {
            const isLinkMode = currentVariation === 'link';
            const isLastCarouselLink = isLinkMode && sequence === 2;
            const products = mockProducts.slice(productStartIdx, productStartIdx + 4);
            const carouselHtml = renderCarousel(carouselId, products);

            let headerContent = `
                <div class="header-row">
                    <h2>${title}</h2>
                    ${isLinkMode && sequence < 2 ? `<a class="see-more-link" id="see-more-link-${sequence}" onclick="loadMoreCarousel(${sequence})">See More</a>` : ''}
                </div>
                <p>${subtitle}</p>
            `;

            let bottomContent = '';
            if (isLinkMode && isLastCarouselLink) {
                bottomContent = `<button class="see-more-button-full" onclick="openFullSearch()">SEE MORE ITEMS</button>`;
            }

            let chipsContent = '';
            if (!isLinkMode) {
                chipsContent = renderNudgeChips(sequence, productStartIdx, category, browseLevel);
            }

            return `
                <div class="chat-message agent visible">
                    <div class="chat-avatar"><img src="https://wsgc.my.site.com/ESWSousChefAgentOlive1760167198695vforce/resource/AgentOliveIcon" alt="Olive"></div>
                    <div class="message-content">
                        <div class="preview-container">
                            <div class="header">
                                ${headerContent}
                            </div>
                            <div class="carousel-section" id="${carouselId}">
                                ${carouselHtml}
                            </div>
                            ${bottomContent}
                            ${chipsContent}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderCarousel(carouselId, products) {
            if (!carouselStates[carouselId]) {
                carouselStates[carouselId] = { currentSlide: 0 };
            }

            const state = carouselStates[carouselId];
            const slides = [];
            
            // Create 2-product slides
            for (let i = 0; i < products.length; i += 2) {
                slides.push(products.slice(i, i + 2));
            }

            const currentSlideProducts = slides[state.currentSlide] || [];

            const productCardsHtml = currentSlideProducts.map(p => `
                <div class="product-card">
                    <div class="product-card-inner">
                        ${p.badge ? `<div class="product-badge badge-${p.badge}"><span class="badge-text">${getBadgeText(p.badge)}</span></div>` : ''}
                        <div class="product-image-container">
                            <img src="${p.imageUrl}" alt="${p.name}" class="product-image" onerror="this.src='https://via.placeholder.com/400x400/fafaf9/706e6b?text=Coffee+Maker';">
                        </div>
                        <div class="product-details">
                            <h3 class="product-name">${p.name}</h3>
                            <div class="price-text">$${p.price.toFixed(2)}</div>
                            <div class="action-buttons">
                                <button class="btn btn-quick-view">QUICK VIEW</button>
                                <a href="${p.productUrl}" target="_blank" rel="noopener noreferrer" class="btn btn-shop-now">SHOP NOW</a>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');

            const prevDisabled = state.currentSlide === 0 ? 'disabled' : '';
            const nextDisabled = state.currentSlide >= slides.length - 1 ? 'disabled' : '';

            const dotsHtml = slides.map((_, idx) => `
                <button class="pagination-dot ${idx === state.currentSlide ? 'active' : ''}" onclick="goToSlide('${carouselId}', ${idx})"></button>
            `).join('');

            return `
                <div class="carousel-wrapper">
                    <div class="carousel-track">
                        ${productCardsHtml}
                    </div>
                </div>
                <div class="carousel-navigation">
                    <button class="carousel-nav" onclick="goToSlide('${carouselId}', ${state.currentSlide - 1})" ${prevDisabled}>&lsaquo;</button>
                    <div class="pagination-container">
                        ${dotsHtml}
                    </div>
                    <button class="carousel-nav" onclick="goToSlide('${carouselId}', ${state.currentSlide + 1})" ${nextDisabled}>&rsaquo;</button>
                </div>
            `;
        }

        function getBadgeText(badge) {
            const badgeMap = {
                'olivePick': 'OLIVE PICK',
                'bestSeller': 'BEST SELLER',
                'topRated': 'TOP RATED'
            };
            return badgeMap[badge] || badge;
        }

        function goToSlide(carouselId, slideIdx) {
            const state = carouselStates[carouselId];
            if (!state) return;

            const pageNum = parseInt(carouselId.split('-')[1], 10);
            const productStartIdx = pageNum * 4;
            const products = mockProducts.slice(productStartIdx, productStartIdx + 4);
            const totalSlides = Math.ceil(products.length / 2);

            slideIdx = Math.max(0, Math.min(slideIdx, totalSlides - 1));
            state.currentSlide = slideIdx;

            const wrapper = document.getElementById(carouselId);
            if (!wrapper) return;

            const carouselHtml = renderCarousel(carouselId, products);
            wrapper.innerHTML = carouselHtml;
        }

        function loadMoreCarousel(currentPageNum) {
            const chatContainer = document.getElementById('chatContainer');
            const body = document.getElementById('phoneScreenBody');
            const nextPageNum = currentPageNum + 1;
            const productStartIdx = nextPageNum * 4;

            const link = document.getElementById(`see-more-link-${currentPageNum}`);
            if (link) link.classList.add('is-hidden');

            const carouselId = `carousel-${nextPageNum}`;
            carouselSequence = nextPageNum;
            carouselStates[carouselId] = { currentSlide: 0 };

            const titles = ['Coffee Makers', 'More Coffee Makers', 'More Coffee Makers'];
            const subtitles = [
                'Coffee makers curated just for you • 5 items',
                'More options curated for you • 4 items',
                'More options curated for you • 4 items'
            ];

            const nextCarouselBlock = renderCarouselBlock(carouselId, nextPageNum, productStartIdx, titles[nextPageNum], subtitles[nextPageNum]);
            chatContainer.insertAdjacentHTML('beforeend', nextCarouselBlock);

            body.scrollTop = body.scrollHeight;
        }

        function openFullSearch() {
            window.open('https://www.williams-sonoma.com/search/results.html?query=coffee+maker', '_blank');
        }

        function selectVariation(variation) {
            currentVariation = variation;
            renderInitialChat();
            loadComments();
        }

        function renderNudgeChips(sequence, productStartIdx, category = 'coffee', browseLevel = 1) {
            let chipDefs = [];
            
            // Define chips based on category
            if (category === 'coffee') {
                chipDefs = [
                    { id: 'see-more-coffee', label: 'See more coffee makers', icon: '☕', action: 'loadChipCarousel', sequence: sequence, nextTitle: 'More Coffee Makers', nextSubtitle: 'More options curated for you • 4 items', nextProducts: productStartIdx + 4 },
                    { id: 'show-espresso', label: 'Show me espresso machines', icon: '✦', action: 'loadChipCarousel', sequence: sequence, nextTitle: 'Espresso Machines', nextSubtitle: 'Espresso options for your kitchen • 4 items', nextProducts: 4, newCategory: 'espresso' },
                    { id: 'help-decide', label: 'Help me decide', icon: '💬', action: 'helpDecide', sequence: sequence, category: 'coffee' }
                ];
                // Add "Browse All" nudge on 3rd level
                if (browseLevel === 3) {
                    chipDefs.unshift({ id: 'browse-all-coffee', label: 'Browse All Coffee Makers', icon: '→', action: 'browseAll', url: 'https://www.williams-sonoma.com/products/coffee-tea/coffee-makers/' });
                }
            } else if (category === 'espresso') {
                chipDefs = [
                    { id: 'see-more-espresso', label: 'See more espresso machines', icon: '✦', action: 'loadChipCarousel', sequence: sequence, nextTitle: 'More Espresso Machines', nextSubtitle: 'More options curated for you • 4 items', nextProducts: productStartIdx + 4 },
                    { id: 'show-grinders', label: 'Show me coffee grinders', icon: '⚙️', action: 'loadChipCarousel', sequence: sequence, nextTitle: 'Coffee Grinders', nextSubtitle: 'Grinders to pair with your espresso • 4 items', nextProducts: 8, newCategory: 'grinders' },
                    { id: 'help-decide-espresso', label: 'Help me decide', icon: '💬', action: 'helpDecide', sequence: sequence, category: 'espresso' }
                ];
                if (browseLevel === 3) {
                    chipDefs.unshift({ id: 'browse-all-espresso', label: 'Browse All Espresso Machines', icon: '→', action: 'browseAll', url: 'https://www.williams-sonoma.com/products/coffee-tea/espresso-machines/' });
                }
            } else if (category === 'grinders') {
                chipDefs = [
                    { id: 'see-more-grinders', label: 'See more coffee grinders', icon: '⚙️', action: 'loadChipCarousel', sequence: sequence, nextTitle: 'More Coffee Grinders', nextSubtitle: 'More options curated for you • 4 items', nextProducts: productStartIdx + 4 },
                    { id: 'show-espresso-grinders', label: 'Show me espresso machines', icon: '✦', action: 'loadChipCarousel', sequence: sequence, nextTitle: 'Espresso Machines', nextSubtitle: 'Espresso options for your kitchen • 4 items', nextProducts: 4, newCategory: 'espresso' },
                    { id: 'help-decide-grinders', label: 'Help me decide', icon: '💬', action: 'helpDecide', sequence: sequence, category: 'grinders' }
                ];
                if (browseLevel === 3) {
                    chipDefs.unshift({ id: 'browse-all-grinders', label: 'Browse All Coffee Grinders', icon: '→', action: 'browseAll', url: 'https://www.williams-sonoma.com/products/coffee-tea/grinders/' });
                }
            }

            const chipsHtml = chipDefs.map(chip => {
                let onclick = '';
                if (chip.action === 'loadChipCarousel') {
                    const newCat = chip.newCategory || category;
                    const newLevel = browseLevel + 1;
                    onclick = `handleNudgeChip('${chip.id}','${chip.action}',${sequence},'${chip.nextTitle}','${chip.nextSubtitle}',${chip.nextProducts},'${newCat}',${newLevel})`;
                } else if (chip.action === 'browseAll') {
                    onclick = `window.open('${chip.url}', '_blank')`;
                } else if (chip.action === 'helpDecide') {
                    onclick = `handleNudgeChip('${chip.id}','${chip.action}',${sequence},'','',0,'${chip.category}',${browseLevel})`;
                }
                
                return `<button type="button" class="nudge-chip" id="chip-${chip.id}" onclick="${onclick}"><span class="nudge-chip-icon">${chip.icon}</span>${chip.label}</button>`;
            }).join('');

            return `
                <div class="nudge-chips-container visible">
                    <div class="nudge-chips-label">What would you like to do?</div>
                    <div class="nudge-chips-row">
                        ${chipsHtml}
                    </div>
                </div>
            `;
        }

        function handleNudgeChip(chipId, action, sequence, nextTitle, nextSubtitle, nextProducts, category = 'coffee', browseLevel = 1) {
            const chip = document.getElementById(`chip-${chipId}`);
            if (chip) chip.classList.add('selected');

            const chatContainer = document.getElementById('chatContainer');
            const body = document.getElementById('phoneScreenBody');

            if (action === 'loadChipCarousel') {
                const newSequence = sequence + 1;
                const carouselId = `carousel-chip-${newSequence}`;
                carouselStates[carouselId] = { currentSlide: 0 };
                
                currentCategory = category;
                browseLevelByCategory[category] = browseLevel;

                const carouselBlock = renderCarouselBlock(carouselId, newSequence, nextProducts, nextTitle, nextSubtitle, category, browseLevel);
                chatContainer.insertAdjacentHTML('beforeend', carouselBlock);
            } else if (action === 'helpDecide') {
                // Phase 1: Show use-case questions
                let questionText = '';
                let buttons = [];
                
                if (category === 'coffee') {
                    questionText = 'What matters most to you?';
                    buttons = [
                        { label: '⚡ Speed - I brew multiple cups daily', value: 'speed', category: 'coffee' },
                        { label: '✨ Quality - I want the best brew', value: 'quality', category: 'coffee' },
                        { label: '💰 Value - I want reliable without premium price', value: 'value', category: 'coffee' }
                    ];
                } else if (category === 'espresso') {
                    questionText = "What's your priority?";
                    buttons = [
                        { label: '⚡ Speed - Quick espresso shots', value: 'speed', category: 'espresso' },
                        { label: '✨ Precision - Temperature/pressure control', value: 'precision', category: 'espresso' },
                        { label: '💰 Simplicity - Easy to use', value: 'simplicity', category: 'espresso' }
                    ];
                } else if (category === 'grinders') {
                    questionText = 'What suits your workflow?';
                    buttons = [
                        { label: '⚡ Speed - Quick grinding', value: 'speed', category: 'grinders' },
                        { label: '✨ Consistency - Uniform grind size', value: 'consistency', category: 'grinders' },
                        { label: '💰 Durability - Long-lasting', value: 'durability', category: 'grinders' }
                    ];
                }
                
                const buttonHtml = buttons.map((btn, idx) => 
                    `<button type="button" class="nudge-chip" onclick="handleDecideAnswer('${btn.value}', '${btn.category}', ${sequence})"><span class="nudge-chip-icon">→</span>${btn.label}</button>`
                ).join('');
                
                const questionMsg = `
                    <div class="chat-message agent visible">
                        <div class="chat-avatar"><img src="https://wsgc.my.site.com/ESWSousChefAgentOlive1760167198695vforce/resource/AgentOliveIcon" alt="Olive"></div>
                        <div class="message-content">
                            <div class="message-bubble">
                                <div class="message-text">${questionText}</div>
                            </div>
                            <div style="margin-top: 0.75rem; display: flex; flex-wrap: wrap; gap: 0.375rem;">
                                ${buttonHtml}
                            </div>
                        </div>
                    </div>
                `;
                chatContainer.insertAdjacentHTML('beforeend', questionMsg);
            }

            body.scrollTop = body.scrollHeight;
        }

        function handleDecideAnswer(answer, category, sequence) {
            // Phase 2: Show filtered carousel based on answer
            const chatContainer = document.getElementById('chatContainer');
            const body = document.getElementById('phoneScreenBody');
            
            let filteredTitle = '';
            let filteredSubtitle = '';
            let filteredProducts = 0;
            
            // Determine product subset based on answer
            if (answer === 'speed') {
                filteredTitle = category.charAt(0).toUpperCase() + category.slice(1) + ' - Speed Optimized';
                filteredSubtitle = `Best for quick setup • 4 items`;
                filteredProducts = 0; // Use first set
            } else if (answer === 'quality' || answer === 'precision' || answer === 'consistency') {
                filteredTitle = category.charAt(0).toUpperCase() + category.slice(1) + ' - Premium Options';
                filteredSubtitle = `Best for discerning users • 4 items`;
                filteredProducts = 4; // Use second set
            } else if (answer === 'value' || answer === 'simplicity' || answer === 'durability') {
                filteredTitle = category.charAt(0).toUpperCase() + category.slice(1) + ' - Reliable & Practical';
                filteredSubtitle = `Great all-around options • 4 items`;
                filteredProducts = 8; // Use third set
            }
            
            const newSequence = sequence + 1;
            const carouselId = `carousel-decide-${newSequence}`;
            carouselStates[carouselId] = { currentSlide: 0 };
            
            const carouselBlock = renderCarouselBlock(carouselId, newSequence, filteredProducts, filteredTitle, filteredSubtitle, category, 2);
            chatContainer.insertAdjacentHTML('beforeend', carouselBlock);
            
            body.scrollTop = body.scrollHeight;
        }

        async function loadComments() {
            try {
                const response = await fetch('/api/comments');
                comments = await response.json();
                renderComments();
            } catch (err) {
                console.error('Error loading comments:', err);
            }
        }

        function renderComments() {
            const container = document.getElementById('commentsList');
            
            if (comments.length === 0) {
                container.innerHTML = '<p style="font-size: 0.8125rem; color: #999;">No comments yet.</p>';
                return;
            }

            container.innerHTML = comments.map(c => `
                <div class="comment-item">
                    <div style="display: flex; align-items: center;">
                        <span class="comment-author">${c.author}</span>
                        <span class="comment-type">${c.type}</span>
                    </div>
                    <div class="comment-text">${c.text}</div>
                    <div class="comment-date">${new Date(c.date).toLocaleString()}</div>
                </div>
            `).join('');
        }

        async function submitComment() {
            const author = document.getElementById('commentAuthor').value.trim();
            const text = document.getElementById('commentText').value.trim();
            const type = document.querySelector('input[name="commentType"]:checked')?.value || 'general';

            if (!author || !text) {
                alert('Please enter your name and a comment.');
                return;
            }

            try {
                const response = await fetch('/api/comments', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ author, text, type })
                });

                if (!response.ok) {
                    throw new Error('Failed to submit comment');
                }

                document.getElementById('commentAuthor').value = '';
                document.getElementById('commentText').value = '';
                await loadComments();
            } catch (err) {
                console.error('Error submitting comment:', err);
                alert('Failed to submit comment.');
            }
        }
    </script>
</body>
